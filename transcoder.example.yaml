server:
  addr: ":8080"
  cache_root: "/var/cache/media-transcoder/segments"
  vfs_cache_root: "/var/cache/media-transcoder/vfs"
  debug: true
  max_jobs: 4
  request_timeout: "30m"
  allow_input_roots:
    - "/srv/media"
  cors_origins:
    - "http://localhost:5173"

libraries:
  # Every library is opened through rclone's fs + VFS layer. A plain path uses
  # the local backend; any rclone connection string or configured remote works.
  movies:
    vfs: "/srv/media/movies"

  # Connection-string remote example (all rclone backends are linked):
  tv:
    vfs: ":s3,provider=AWS,env_auth=true:my-media-bucket/tv"

  # For secrets, pass base64/base64url encoded JSON instead of plaintext YAML:
  # {"vfs":"remote:movies","options":{"vfs_cache_mode":"full","vfs_read_ahead":"64M"}}
  # private_movies:
  #   encoded_config: "eyJ2ZnMiOiJyZW1vdGU6bW92aWVzIiwib3B0aW9ucyI6eyJ2ZnNfY2FjaGVfbW9kZSI6ImZ1bGwifX0"

profiles:
  web-h264:
    container: hls
    segment_type: fmp4
    segment_seconds: 4
    audio:
      mode: transcode
      codec: aac
      bitrate: 128000
      channels: 2
      sample_rate: 48000
    video:
      codec: h264
      encoder_name: libx264
      # Required for *_vaapi encoders; defaults to /dev/dri/renderD128.
      # hardware_device: /dev/dri/renderD128
      # hardware_decode: true # VAAPI decode + scale_vaapi zero-copy path
      preset: veryfast
      crf: 28
      gop_size: 96
      max_b_frames: 0
    variants:
      - name: 360p
        width: 640
        height: 360
        video_bitrate: 900000
        crf: 30
      - name: 720p
        width: 1280
        height: 720
        video_bitrate: 2800000
        crf: 28

  nvidia-h264:
    container: hls
    segment_type: fmp4
    segment_seconds: 4
    audio:
      mode: transcode
      codec: aac
      bitrate: 128000
      channels: 2
    video:
      codec: h264
      encoder_name: h264_nvenc
      preset: fast
      crf: 30
      gop_size: 96
      max_b_frames: 0
    variants:
      - name: 720p
        width: 1280
        height: 720
        video_bitrate: 2800000
      - name: 1080p
        width: 1920
        height: 1080
        video_bitrate: 5000000
