server:
  addr: ":8080"
  cache_root: "/var/cache/media-transcoder"
  debug: true
  max_jobs: 4
  request_timeout: "30m"
  allow_input_roots:
    - "/srv/media"
  cors_origins:
    - "http://localhost:5173"

libraries:
  movies:
    root: "/srv/media/movies"
    allow_symlinks: false
  tv:
    root: "/srv/media/tv"
    allow_symlinks: false

profiles:
  web-h264:
    container: hls
    segment_type: fmp4
    segment_seconds: 4
    audio:
      mode: transcode
      codec: aac
      bitrate: 128000
      channels: 2
      sample_rate: 48000
    video:
      codec: h264
      encoder_name: libx264
      preset: veryfast
      crf: 28
      gop_size: 96
      max_b_frames: 0
    variants:
      - name: 360p
        width: 640
        height: 360
        video_bitrate: 900000
        crf: 30
      - name: 720p
        width: 1280
        height: 720
        video_bitrate: 2800000
        crf: 28

  nvidia-h264:
    container: hls
    segment_type: fmp4
    segment_seconds: 4
    audio:
      mode: transcode
      codec: aac
      bitrate: 128000
      channels: 2
    video:
      codec: h264
      encoder_name: h264_nvenc
      preset: fast
      crf: 30
      gop_size: 96
      max_b_frames: 0
    variants:
      - name: 720p
        width: 1280
        height: 720
        video_bitrate: 2800000
      - name: 1080p
        width: 1920
        height: 1080
        video_bitrate: 5000000
